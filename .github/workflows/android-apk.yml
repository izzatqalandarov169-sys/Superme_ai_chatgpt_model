name: CHATGPT ULTRA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.10.2
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/CHATGPT-ULTRA-debug.apk
          ls -lh output/CHATGPT-ULTRA-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHATGPT-ULTRA-APK
          path: output/CHATGPT-ULTRA-debug.apk
          if-no-files-found: error
          retention-days: 14
