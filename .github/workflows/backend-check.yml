name: SUPERME AI backend check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: node --check server.js
      - run: node --check agent.js
      - name: Smoke import
        run: node -e "import('./agent.js').then(()=>console.log('agent import OK'))"
