name: CHATGPT ULTRA - Web/Source Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: web
        type: choice
        options: [web, zip]
      artifact_name:
        description: Artifact name
        required: true
        default: chatgpt-ultra-web

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare output
        run: mkdir -p output
      - name: Build web package
        if: inputs.target == 'web'
        run: |
          cp -r web output/web
          cd output
          zip -r "../${{ inputs.artifact_name }}.zip" web
      - name: Package source
        if: inputs.target == 'zip'
        run: |
          zip -r "output/${{ inputs.artifact_name }}.zip" . -x '.git/*' '.github/*' 'output/*'
      - name: Upload web/source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: output/
          if-no-files-found: error
          retention-days: 7
