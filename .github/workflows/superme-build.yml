name: SUPERME AI - Build Project

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: web
        type: choice
        options: [web, android, zip]
      artifact_name:
        description: Artifact name
        required: true
        default: superme-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "artifact=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=web" >> "$GITHUB_OUTPUT"
            echo "artifact=superme-build" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.target.outputs.target == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web
        if: steps.target.outputs.target == 'web'
        run: |
          rm -rf output
          mkdir -p output
          if [ -f web/package.json ]; then
            cd web
            npm install
            npm run build
            cp -r dist ../output/web
          else
            cp -r web output/web
          fi

      - name: Package source
        if: steps.target.outputs.target == 'zip'
        run: |
          rm -rf output
          mkdir -p output
          zip -r "output/${{ steps.target.outputs.artifact }}.zip" . -x '.git/*' '.github/*'

      - name: Prepare Android artifact
        if: steps.target.outputs.target == 'android'
        run: |
          rm -rf output
          mkdir -p output
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
            find . -type f -name '*.apk' -exec cp {} output/ \;
          else
            echo 'Android project/Gradle wrapper is not configured yet.' > output/ANDROID_BUILD_REQUIRED.txt
          fi

      - name: Package web output
        if: steps.target.outputs.target == 'web'
        run: cd output && zip -r "../${{ steps.target.outputs.artifact }}.zip" web

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact }}
          path: |
            output/*
            ${{ steps.target.outputs.artifact }}.zip
          if-no-files-found: error
          retention-days: 7
