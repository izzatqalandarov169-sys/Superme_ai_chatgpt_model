name: SUPERME AI - Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: web
        type: choice
        options:
          - web
          - zip
          - android
      artifact_name:
        description: Artifact name
        required: true
        default: SUPERME-AI-Build
      build_type:
        description: Android build type
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  GODOT_VERSION: '4.4.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web
        if: inputs.target == 'web'
        shell: bash
        run: |
          set -e
          test -f web/index.html
          test -f web/app.js
          test -f web/style.css
          mkdir -p build/web
          cp -R web/. build/web/
          echo 'SUPERME AI web build ready.'

      - name: Build source ZIP
        if: inputs.target == 'zip'
        shell: bash
        run: |
          set -e
          mkdir -p build
          zip -r "build/${{ inputs.artifact_name }}.zip" . \
            -x '.git/*' 'build/*' 'node_modules/*' '.env' '*.log'
          test -s "build/${{ inputs.artifact_name }}.zip"

      - name: Verify Godot project
        if: inputs.target == 'android'
        shell: bash
        run: |
          set -e
          test -f project.godot
          test -f export_presets.cfg
          grep -q '^\[preset\.0\]' export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg

      - name: Install Godot
        if: inputs.target == 'android'
        shell: bash
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install Android SDK
        if: inputs.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        if: inputs.target == 'android'
        shell: bash
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          yes | sdkmanager --licenses >/dev/null || true

      - name: Export Android APK
        if: inputs.target == 'android'
        shell: bash
        run: |
          set -e
          mkdir -p build/android
          if [ "${{ inputs.build_type }}" = 'release' ]; then
            godot --headless --path . --export-release 'Android' "build/android/${{ inputs.artifact_name }}.apk"
          else
            godot --headless --path . --export-debug 'Android' "build/android/${{ inputs.artifact_name }}.apk"
          fi
          test -s "build/android/${{ inputs.artifact_name }}.apk"

      - name: Upload web artifact
        if: inputs.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZIP artifact
        if: inputs.target == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/${{ inputs.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK artifact
        if: inputs.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/android/${{ inputs.artifact_name }}.apk
          if-no-files-found: error
          retention-days: 14
