name: CHATGPT ULTRA - Build and Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: web
        type: choice
        options: [web, android, zip]
      artifact_name:
        description: Artifact name
        required: true
        default: chatgpt-ultra-build

permissions:
  contents: read

env:
  BUILD_ARTIFACT: ${{ inputs.artifact_name || 'chatgpt-ultra-build' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "artifact=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=web" >> "$GITHUB_OUTPUT"
            echo "artifact=chatgpt-ultra-build" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare artifact directory
        run: mkdir -p output

      - name: Build Web
        if: steps.target.outputs.target == 'web'
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm install
            npm run build
            cp -r dist ../output/web
          else
            cp -r web output/web
          fi
          cd output
          zip -r "../${{ steps.target.outputs.artifact }}.zip" web

      - name: Package Source ZIP
        if: steps.target.outputs.target == 'zip'
        run: |
          zip -r "output/${{ steps.target.outputs.artifact }}.zip" . \
            -x '.git/*' '.github/*' 'output/*'

      - name: Build Android APK
        if: steps.target.outputs.target == 'android'
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
            find . -type f -name '*.apk' -exec cp {} output/ \;
          else
            echo 'No Gradle Android project found.'
            exit 1
          fi

      - name: Verify artifact files
        run: |
          echo '=== ARTIFACT FILES ==='
          find output -type f -maxdepth 3 -print
          test -n "$(find output -type f -print -quit)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Build summary
        run: |
          {
            echo '## 📦 CHATGPT ULTRA Build';
            echo '';
            echo "**Target:** ${{ steps.target.outputs.target }}";
            echo "**Artifact:** ${{ steps.target.outputs.artifact }}";
            echo '';
            echo '### Files';
            find output -type f -printf '%p\n';
          } >> "$GITHUB_STEP_SUMMARY"
