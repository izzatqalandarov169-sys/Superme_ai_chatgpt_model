name: SUPERME AI - Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: web
        type: choice
        options:
          - web
          - zip
          - android
      artifact_name:
        description: Artifact name
        required: true
        default: SUPERME-AI-Build
      build_type:
        description: Android build type
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web
        if: inputs.target == 'web'
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/app.js
          test -f web/style.css
          mkdir -p build/web
          cp -R web/. build/web/

      - name: Build source ZIP
        if: inputs.target == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          zip -r "build/${{ inputs.artifact_name }}.zip" . \
            -x '.git/*' 'build/*' 'node_modules/*' 'backend/data/*' 'backend/workspace/*' '.env' '*.log'
          test -s "build/${{ inputs.artifact_name }}.zip"

      - name: Validate Android project
        if: inputs.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle

      - name: Set up JDK
        if: inputs.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: inputs.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: inputs.target == 'android'
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build Android APK
        if: inputs.target == 'android'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = 'release' ]; then
            ./gradlew :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../build-${{ inputs.artifact_name }}.apk"
          else
            ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../build-${{ inputs.artifact_name }}.apk"
          fi

      - name: Move Android artifact
        if: inputs.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          mv "build-${{ inputs.artifact_name }}.apk" "build/android/${{ inputs.artifact_name }}.apk"
          test -s "build/android/${{ inputs.artifact_name }}.apk"

      - name: Upload web artifact
        if: inputs.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZIP artifact
        if: inputs.target == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/${{ inputs.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK artifact
        if: inputs.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/android/${{ inputs.artifact_name }}.apk
          if-no-files-found: error
          retention-days: 14
